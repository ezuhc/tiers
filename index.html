3D%22%233a2b20%22/%3E%3Crect%20x%3D%223%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%233a2b20%22/%3E%3Crect%20x%3D%224%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23cfcfcf%22/%3E%3Crect%20x%3D%225%22%20y%3D%2210%22%20width%3D%226%22%20height%3D%221%22%20fill%3D%22%238f8f8f%22/%3E%3Crect%20x%3D%2211%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%235b5b5b%22/%3E%3Crect%20x%3D%2212%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%233a2b20%22/%3E%3Crect%20x%3D%224%22%20y%3D%2211%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%233a2b20%22/%3E%3Crect%20x%3D%225%22%20y%3D%2211%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23cfcfcf%22/%3E%3Crect%20x%3D%226%22%20y%3D%2211%22%20width%3D%225%22%20height%3D%221%22%20fill%3D%22%238f8f8f%22/%3E%3Crect%20x%3D%2211%22%20y%3D%2211%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%235b5b5b%22/%3E%3Crect%20x%3D%2212%22%20y%3D%2211%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%233a2b20%22/%3E%3Crect%20x%3D%224%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%233a2b20%22/%3E%3Crect%20x%3D%225%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23cfcfcf%22/%3E%3Crect%20x%3D%226%22%20y%3D%2212%22%20width%3D%224%22%20height%3D%221%22%20fill%3D%22%238f8f8f%22/%3E%3Crect%20x%3D%2210%22%20y%3D%2212%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%235b5b5b%22/%3E%3Crect%20x%3D%2212%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%233a2b20%22/%3E%3Crect%20x%3D%225%22%20y%3D%2213%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%233a2b20%22/%3E%3Crect%20x%3D%226%22%20y%3D%2213%22%20width%3D%226%22%20height%3D%221%22%20fill%3D%22%235b5b5b%22/%3E%3Crect%20x%3D%2212%22%20y%3D%2213%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%233a2b20%22/%3E%3Crect%20x%3D%225%22%20y%3D%2214%22%20width%3D%228%22%20height%3D%221%22%20fill%3D%22%233a2b20%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e0805; --panel:#1a1009; --panel2:#22150c; --line:#3a261a; --text:#f6ece3; --mute:#a99383;
  --accent:#ff8a1f; --accent2:#ff5a0a; --gold:#f2b429; --silver:#aab4c3; --bronze:#c9803c;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1000px 420px at 50% -160px,rgba(255,110,20,.18),transparent 70%) no-repeat,var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 48px}

/* ---------- top bar ---------- */
nav.top{position:sticky;top:0;z-index:20;background:rgba(14,8,5,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.navin{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 10px rgba(255,110,20,.55))}
.logo svg{width:100%;height:100%;display:block}
.bname{font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1;background:linear-gradient(180deg,#ffd27a,#ff8a1f 55%,#ff5a0a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.bname small{display:block;font-size:10px;letter-spacing:.28em;margin-top:4px;font-weight:700;color:var(--mute);-webkit-text-fill-color:var(--mute)}
.links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.links a,.links button{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;color:var(--mute);font-weight:600;background:none;border:0;cursor:pointer}
.links a:hover,.links button:hover,.links a.on{color:var(--text);background:var(--panel)}
.links b{color:var(--text)}
.sp{flex:1}
.search{position:relative;min-width:200px;flex:0 1 340px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:10px 16px;font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.sres[hidden]{display:none}
.sres a{display:flex;align-items:center;gap:10px;padding:9px 12px}
.sres a:hover{background:var(--panel2)}
.sres a span{flex:1}
.sres small{color:var(--mute)}
.sres .e{padding:12px;color:var(--mute);font-size:13px}
.av{border-radius:5px;background:#0c0704;flex:none;image-rendering:pixelated}

/* ---------- gamemode tabs ---------- */
.tabs{display:flex;gap:2px;overflow-x:auto;margin:22px 0 0;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:none;min-width:92px;padding:12px 14px 10px;text-align:center;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;border-radius:12px 12px 0 0;user-select:none}
.tab:hover{color:var(--text);background:var(--panel)}
.tab.on{color:#fff;border-bottom-color:var(--accent);background:linear-gradient(180deg,transparent,rgba(255,138,31,.13))}
.tab .ti{display:block;margin:0 auto 4px;pointer-events:none}
.tab .tl{display:block;font-weight:700;font-size:14px;pointer-events:none}
.tab.on .ti{color:var(--accent)}

/* ---------- page header ---------- */
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:22px 0 16px}
.mhead h2{margin:0;font-size:28px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.mhead h2 .mi{color:var(--accent);display:inline-flex}
.mhead .sub{color:var(--mute);margin-top:4px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;padding:2px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12px;color:var(--mute)}
.pill.stale{border-color:#8a4a1a;color:#ffb066}
.mright{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{color:var(--accent)}
.ipbox{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px}
.ipbox small{display:block;color:var(--mute);font-size:10px;letter-spacing:.14em;font-weight:700}
.ipbox b{font-size:14px}
.ipbox .cp{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}
.ipbox .dc{background:#5865f2;color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}

/* ---------- overall rankings ---------- */
.board{--cols:210px minmax(0,1fr) 84px minmax(0,1.6fr)}
.board.noreg{--cols:210px minmax(0,1fr) minmax(0,1.8fr)}
.thead{display:grid;grid-template-columns:var(--cols);gap:14px;padding:4px 16px 8px;color:var(--mute);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.thead .tr{text-align:right;padding-right:16px}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:72px}
.prow:hover{border-color:rgba(255,138,31,.6);background:#20130b}
.rk{display:flex;align-items:center;justify-content:space-between;align-self:stretch;min-height:72px;padding-left:16px;background:linear-gradient(90deg,#2a1b12,#35231a)}
.rk .n{font-weight:900;font-style:italic;font-size:30px;color:#cdbcab}
.bust{height:72px;width:84px;object-fit:cover;object-position:top center;clip-path:polygon(24% 0,100% 0,100% 100%,0 100%);background:rgba(0,0,0,.18)}
.rk.r1{background:linear-gradient(90deg,#f2b429,#c98f12)} .rk.r1 .n{color:#3b2606}
.rk.r2{background:linear-gradient(90deg,#aab4c3,#7f8998)} .rk.r2 .n{color:#262b33}
.rk.r3{background:linear-gradient(90deg,#c9803c,#9a5a22)} .rk.r3 .n{color:#33190a}
.pinfo{min-width:0}
.pname{font-weight:800;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;flex-wrap:wrap}
.ptitle .bk{width:18px;height:18px;display:inline-flex}
.ptitle .bk svg{width:100%;height:100%}
.ptitle .tt{color:var(--text);font-weight:600}
.ptitle i{font-style:normal;color:var(--mute)}
.ptitle.big{font-size:16px;margin-top:4px}
.preg{text-align:center}
.reg{display:inline-block;min-width:56px;padding:10px 12px;border-radius:10px;font-weight:800;letter-spacing:.03em;background:color-mix(in srgb,var(--rc) 26%,#150d08);color:color-mix(in srgb,var(--rc) 65%,#fff);border:1px solid color-mix(in srgb,var(--rc) 40%,transparent)}
.ptiers{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:flex-end;padding:8px 16px 8px 0}
.tc{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px}
.gi{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:#120a06;border:2px solid var(--c);color:#e8dccf;flex:none}
.tc b{font-size:12px;letter-spacing:.02em}

/* ---------- gamemode tier columns ---------- */
.tiersrow{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:14px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}
.th{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:14px;font-size:24px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.t1 .th{background:linear-gradient(180deg,#5d3d0a,#3d2807);color:#ffd36b;border-color:#6a4810}
.t2 .th{background:linear-gradient(180deg,#434a55,#2d323b);color:#e4e9f1;border-color:#555d6a}
.t3 .th{background:linear-gradient(180deg,#52301a,#38210f);color:#eaa75f;border-color:#6a3f1f}
.tl{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.pc{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);border-left:3px solid var(--rc,#6a4630);border-radius:4px 10px 10px 4px}
.pc:hover{background:#26170e}
.pc .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pc .chev{display:inline-flex;flex:none}
.none{padding:14px;color:var(--mute);text-align:center;font-size:13px}

/* ---------- profile ---------- */
.back{display:inline-block;margin:18px 0 12px;color:var(--mute);cursor:pointer}
.back:hover{color:var(--text)}
.profile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.ph{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.phimg .bust{width:110px;height:110px;clip-path:none;border-radius:14px;background:#0c0704}
.ph h2{margin:0;font-size:30px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--mute)}
.stat b{color:var(--text);font-size:15px;margin-left:4px}
.rank.r1{color:var(--gold)} .rank.r2{color:var(--silver)} .rank.r3{color:var(--bronze)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:20px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.cg{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.cg .gm{font-weight:700}
.cg b{font-size:18px}
.line{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:6px}

/* ---------- misc ---------- */
.state{padding:44px 16px;text-align:center;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:14px}
.state b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;margin:18px 0;flex-wrap:wrap}
.pager .pg{min-width:40px;justify-content:center}
.pager .pg.on{background:linear-gradient(180deg,var(--accent),var(--accent2));border-color:var(--accent);color:#1d0d02}
.dots{color:var(--mute)}
.skelrow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#24160d,#34200f,#24160d);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
footer{color:var(--mute);font-size:12px;text-align:center;margin-top:34px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;z-index:50;padding:16px}

ght="1" fill="#3a2b20"/><rect x="4" y="9" width="1" height="1" fill="#cfcfcf"/><rect x="5" y="9" width="6" height="1" fill="#8f8f8f"/><rect x="11" y="9" width="1" height="1" fill="#5b5b5b"/><rect x="12" y="9" width="1" height="1" fill="#3a2b20"/><rect x="3" y="10" width="1" height="1" fill="#3a2b20"/><rect x="4" y="10" width="1" height="1" fill="#cfcfcf"/><rect x="5" y="10" width="6" height="1" fill="#8f8f8f"/><rect x="11" y="10" width="1" height="1" fill="#5b5b5b"/><rect x="12" y="10" width="1" height="1" fill="#3a2b20"/><rect x="4" y="11" width="1" height="1" fill="#3a2b20"/><rect x="5" y="11" width="1" height="1" fill="#cfcfcf"/><rect x="6" y="11" width="5" height="1" fill="#8f8f8f"/><rect x="11" y="11" width="1" height="1" fill="#5b5b5b"/><rect x="12" y="11" width="1" height="1" fill="#3a2b20"/><rect x="4" y="12" width="1" height="1" fill="#3a2b20"/><rect x="5" y="12" width="1" height="1" fill="#cfcfcf"/><rect x="6" y="12" width="4" height="1" fill="#8f8f8f"/><rect x="10" y="12" width="2" height="1" fill="#5b5b5b"/><rect x="12" y="12" width="1" height="1" fill="#3a2b20"/><rect x="5" y="13" width="1" height="1" fill="#3a2b20"/><rect x="6" y="13" width="6" height="1" fill="#5b5b5b"/><rect x="12" y="13" width="1" height="1" fill="#3a2b20"/><rect x="5" y="14" width="8" height="1" fill="#3a2b20"/></svg></span><span class="bname" id="bname">EzPvP<small>TIERLIST</small></span></div>

<script>
// If you host this file on another website, put your server address here, e.g. "http://123.45.67.89:8080"
const API_BASE = "";

// Static hosting (GitHub Pages): the plugin sets this to "data.json" when it uploads the site. Leave empty when the plugin serves the page itself.
// Site name shown in the header and tab title. Leave "" to use site.title from the plugin config instead.
const SITE_NAME = "EzPvP Tierlist";
const NAME = () => SITE_NAME || (META && META.title) || "Tier Rankings";

const STATIC_DATA = "data.json";

/*STATIC-SHIM-START*/
if (STATIC_DATA) (function(){
  const realFetch = window.fetch.bind(window);
  let DATA = null, loading = null;
  function jr(code, obj){ return new Response(JSON.stringify(obj), {status: code, headers: {"Content-Type": "application/json"}}); }
  function ensure(){
    if (DATA && Date.now() - DATA._t < 60000) return Promise.resolve(DATA);
    if (!loading) {
      loading = realFetch(STATIC_DATA + "?t=" + Math.floor(Date.now() / 60000))
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(d => { d._t = Date.now(); DATA = d; loading = null; return d; })
        .catch(e => { loading = null; throw e; });
    }
    return loading;
  }
  const idx = (D, name) => D.tierNames.indexOf(name);
  window.fetch = async function(url, opts){
    const u = new URL(String(url), location.href);
    const at = u.pathname.indexOf("/api/");
    if (at < 0) return realFetch(url, opts);
    const D = await ensure();
    const tail = u.pathname.slice(at + 5), q = u.searchParams;
    if (tail === "meta") {
      return jr(200, {title: D.title, subtitle: D.subtitle, updateMinutes: D.updateMinutes, staleAfterMinutes: D.staleAfterMinutes, ready: true,
        season: D.season, pointsFrom: D.pointsFrom, lastUpdated: D.generatedAt, totalPlayers: D.players.length,
        gamemodes: D.gamemodes, regions: D.regions, tierNames: D.tierNames});
    }
    if (tail === "leaderboard") {
      const mode = (q.get("gamemode") || "").toLowerCase(), search = (q.get("search") || "").trim().toLowerCase().slice(0, 32), region = (q.get("region") || "").trim();
      const limit = Math.max(1, Math.min(100, parseInt(q.get("limit") || "50", 10) || 50)), page = Math.max(1, parseInt(q.get("page") || "1", 10) || 1);
      let list = D.players;
      if (mode) {
        const t = p => p.tiers.find(x => x.gamemode === mode);
        list = D.players.filter(p => t(p)).sort((a, b) => {
          const x = t(a), y = t(b);
          return idx(D, y.currentTier) - idx(D, x.currentTier) || idx(D, y.peakTier) - idx(D, x.peakTier) || y.wins - x.wins || a.username.toLowerCase().localeCompare(b.username.toLowerCase());
        }).map((p, i) => Object.assign({}, p, {rank: i + 1, tiers: p.tiers.filter(x => x.gamemode === mode)}));
      }
      list = list.filter(p => (!region || p.region.toLowerCase() === region.toLowerCase()) && (!search || p.username.toLowerCase().includes(search)));
      const from = Math.min((page - 1) * limit, list.length), to = Math.min(from + limit, list.length);
      return jr(200, {ready: true, players: list.slice(from, to), pagination: {page, limit, total: list.length, hasNext: to < list.length}, lastUpdated: D.generatedAt});
    }
    if (tail.startsWith("player/")) {
      const n = decodeURIComponent(tail.slice(7)).toLowerCase();
      const p = D.players.find(x => x.username.toLowerCase() === n);
      return p ? jr(200, Object.assign({}, p, {globalRank: p.rank})) : jr(404, {error: "player not found"});
    }
    return jr(404, {error: "not found"});
  };
})();
/*STATIC-SHIM-END*/

/* ====== EzPvP Tierlist - page v3 (MCTiers-style layout) ====== */
// Optional: shown in the top bar and next to the tier list. Leave "" to hide.
const SERVER_IP = "";        // e.g. "play.yourserver.net"  (adds a copy-IP box)
const DISCORD_URL = "";      // e.g. "https://discord.gg/yourinvite"  (adds a Discord button)

// Player titles by total points (highest first). Rename them as you like.
const TITLES = [[400, "Combat Grandmaster"], [250, "Combat Master"], [100, "Combat Ace"], [50, "Combat Specialist"], [20, "Combat Cadet"], [10, "Combat Novice"], [0, "Rookie"]];

const TIER_COLORS = {
  ST6:"#4b5563", LT6:"#5b6472", MT6:"#6b7280", HT6:"#7d8794",
  LT5:"#8b95a3", MT5:"#9aa4b2", HT5:"#aab3bf",
  LT4:"#3fae6a", MT4:"#4cc37b", HT4:"#63d98f",
  LT3:"#3f8de8", MT3:"#5aa2f5", HT3:"#7ab6ff",
  LT2:"#8e5be0", MT2:"#a272f0", HT2:"#b98bff",
  LT1:"#f08a24", MT1:"#f5a13a", HT1:"#ffd23f"
};
const REGION_COLORS = { NA:"#e5484d", EU:"#30a46c", ME:"#8e4ec6", AS:"#3e63dd", SA:"#e5a50a", OC:"#12a594" };
const RANK_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1.8l9.4 10.2L12 22.2 2.6 12z" fill="rgba(242,180,41,.16)" stroke="#f2b429" stroke-width="1.8"/><path d="M7.6 12.2L12 7.8l4.4 4.4M7.6 16.2l4.4-4.4 4.4 4.4" stroke="#f2b429" stroke-width="1.9"/></svg>';

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { n = Number(n); return Number.isInteger(n) ? String(n) : String(+n.toFixed(2)); };

let META = null;
const state = { mode: "", page: 1 };
let boardQs = "", reqId = 0, searchTimer = null;

async function api(path){
  const r = await fetch(API_BASE + path);
  if(!r.ok){ const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
  return r.json();
}

/* ------------------------------ helpers ------------------------------ */
const tierIdx = t => (META && META.tierNames) ? META.tierNames.indexOf(t) : -1;
const tierNum = t => parseInt(String(t).slice(-1), 10) || 0;
const tierLvl = t => String(t).slice(0, 2);
const tcolor = t => TIER_COLORS[t] || "#6b7280";
const rcolor = r => REGION_COLORS[String(r || "").toUpperCase()] || "#7a6a5e";
const titleFor = pts => { for (const [min, name] of TITLES) if (pts >= min) return name; return ""; };
const PH = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8"><rect width="8" height="8" fill="#3a281c"/><rect x="2" y="2" width="4" height="4" fill="#5e4130"/></svg>');
const IMG_ERR = `if(!this.dataset.f&&this.dataset.fb){this.dataset.f=1;this.src=this.dataset.fb}else{this.onerror=null;this.src=PH}`;

function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if(s < 60) return "just now";
  const m = Math.floor(s / 60); if(m < 60) return m + " min ago";
  return Math.floor(m / 60) + " h ago";
}

/* ------------------------------- icons ------------------------------- */
const ICONS = {
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z" fill="currentColor"/><path d="M8 5H4.5c0 3 1.2 4.5 3.5 4.8M16 5h3.5c0 3-1.2 4.5-3.5 4.8M12 13v3.5M8.5 20h7M10 16.5h4"/>',
  sword: '<path d="M20 4L9 15" stroke-width="2.8"/><path d="M6 12l6 6"/><path d="M5.5 18.5L3 21"/>',
  axe: '<path d="M5 20L15.5 9.5"/><path d="M11.5 4.8c3.4-1.3 6.8-.2 8.5 3.4-3.2.9-5.8.4-8.5-3.4z" fill="currentColor"/>',
  mace: '<path d="M4.5 19.5L12.5 11.5"/><circle cx="16.2" cy="7.8" r="4.2" fill="currentColor"/><path d="M16.2 1.8v1.4M22 7.8h-1.4M10.4 7.8h1.4M20.4 3.6l-1 1M12 3.6l1 1"/>',
  spear: '<path d="M4 20L16 8"/><path d="M14.5 5l6-1.5L19 9.5z" fill="currentColor"/>',
  pot: '<path d="M9.5 3h5M10.5 3v5.5L5.2 17.5A2.5 2.5 0 0 0 7.4 21h9.2a2.5 2.5 0 0 0 2.2-3.5L13.5 8.5V3"/><path d="M7.4 15h9.2" />',
  uhc: '<path d="M12 20.5s-7.5-4.8-7.5-10.2A4.3 4.3 0 0 1 12 7.8a4.3 4.3 0 0 1 7.5 2.5c0 5.4-7.5 10.2-7.5 10.2z" fill="currentColor" stroke="none"/>',
  crystal: '<path d="M12 2.5l6.5 6.2L12 21.5 5.5 8.7z" fill="currentColor" stroke="none"/><path d="M5.5 8.7h13M12 2.5v19" stroke="rgba(0,0,0,.35)" stroke-width="1.4"/>',
  smp: '<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.8" fill="currentColor" stroke="none"/>',
  neth: '<path d="M5 11.5a7 7 0 0 1 14 0V20h-4.2v-4.3H9.2V20H5z" fill="currentColor" stroke="none"/>'
};
function kindOf(slug){
  const s = String(slug).toLowerCase();
  if(s.includes("spear")) return "spear";
  if(s.includes("mace")) return "mace";
  if(s.includes("sword")) return "sword";
  if(s.includes("axe")) return "axe";
  if(s.includes("pot")) return "pot";
  if(s.includes("uhc")) return "uhc";
  if(s.includes("neth")) return "neth";
  if(s.includes("vanilla") || s.includes("crystal")) return "crystal";
  if(s.includes("smp")) return "smp";
  return "";
}
function icon(name, size){
  const body = ICONS[name] || "";
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}
function gIcon(slug, size){
  const k = kindOf(slug);
  if(k) return icon(k, size);
  const L = esc(String(slug).charAt(0).toUpperCase() || "?");
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><text x="12" y="17" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor" font-family="system-ui,sans-serif">${L}</text></svg>`;
}
function chevron(lvl){
  if(lvl === "HT") return '<svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l5-5 5 5"/><path d="M3 13l5-5 5 5"/></svg>';
  return '<svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l5-5 5 5"/></svg>';
}

/* ------------------------------- images ------------------------------ */
function av(p, size){
  return `<img class="av" src="${esc(p.avatarUrl)}" width="${size}" height="${size}" loading="lazy" alt="" onerror="${IMG_ERR}">`;
}
function bust(p){
  const u = p.avatarUrl || "";
  const big = u.includes("mc-heads.net/avatar/") ? u.replace("/avatar/", "/body/").replace(/\/\d+$/, "/200") : u;
  return `<img class="bust" src="${esc(big)}" data-fb="${esc(u)}" loading="lazy" alt="" onerror="${IMG_ERR}">`;
}

/* ------------------------------- header ------------------------------ */
function setHeader(){
  const nm = NAME();
  document.title = nm;
  const i = nm.indexOf(" ");
  $("#bname").innerHTML = i > 0 ? `${esc(nm.slice(0, i))}<small>${esc(nm.slice(i + 1).toUpperCase())}</small>` : esc(nm);
  let links = `<a href="#" data-act="home" class="on">${icon("trophy", 18)} Rankings</a>`;
  if(DISCORD_URL) links += `<a href="${esc(DISCORD_URL)}" target="_blank" rel="noopener">Discord</a>`;
  if(SERVER_IP) links += `<button data-act="ip" title="Copy server IP">Server IP: <b>${esc(SERVER_IP)}</b></button>`;
  links += `<button data-act="info">How it works</button>`;
  $("#links").innerHTML = links;
  if(META && META.ready) $("#foot").textContent = `${nm} · ${META.totalPlayers} ranked players · refreshed every ${META.updateMinutes} min`;
}

function metaPills(){
  if(!META || !META.ready) return "";
  const stale = (Date.now() - new Date(META.lastUpdated).getTime()) > (META.staleAfterMinutes || META.updateMinutes * 3) * 60000;
  return `<div class="meta"><span class="pill">Season ${META.season}</span><span class="pill${stale ? " stale" : ""}">Updated ${ago(META.lastUpdated)}</span></div>`;
}
function rightBox(){
  let h = `<button class="btn" data-act="info">${icon("trophy", 16)} Information</button>`;
  if(SERVER_IP || DISCORD_URL){
    h += `<div class="ipbox">`;
    if(SERVER_IP) h += `<div><small>SERVER IP</small><b>${esc(SERVER_IP)}</b></div><button class="cp" data-act="ip" title="Copy">Copy</button>`;
    if(DISCORD_URL) h += `<a class="dc" href="${esc(DISCORD_URL)}" target="_blank" rel="noopener">Discord</a>`;
    h += `</div>`;
  }
  return h;
}
function headHtml(titleInner, sub){
  return `<div class="mhead"><div><h2>${titleInner}</h2><div class="sub">${sub}</div>${metaPills()}</div><div class="mright">${rightBox()}</div></div>`;
}

/* -------------------------------- tabs ------------------------------- */
function tabsHtml(){
  let h = `<div class="tabs"><div class="tab${state.mode === "" ? " on" : ""}" data-m="">${icon("trophy", 28).replace('<svg ', '<svg class="ti" ')}<span class="tl">Overall</span></div>`;
  for(const g of META.gamemodes){
    h += `<div class="tab${state.mode === g.slug ? " on" : ""}" data-m="${esc(g.slug)}">${gIcon(g.slug, 28).replace('<svg ', '<svg class="ti" ')}<span class="tl">${esc(g.displayName)}</span></div>`;
  }
  return h + `</div>`;
}

function skeleton(){
  let h = `<div class="plist" style="margin-top:22px">`;
  for(let i = 0; i < 6; i++) h += `<div class="skelrow"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%;margin-top:10px"></div></div>`;
  return h + `</div>`;
}
const errorHtml = () => `<div class="state"><b>Couldn’t load rankings.</b><button class="btn" data-act="retry">Retry</button></div>`;

/* --------------------------- overall rankings ------------------------ */
function prow(p){
  const rc = p.rank <= 3 ? " r" + p.rank : "";
  const tiers = p.tiers.slice().sort((a, b) => tierIdx(b.currentTier) - tierIdx(a.currentTier));
  const regionCell = (META.regions && META.regions.length)
    ? `<div class="preg">${p.region ? `<span class="reg" style="--rc:${rcolor(p.region)}">${esc(p.region)}</span>` : ""}</div>` : "";
  const tcs = tiers.map(t => {
    const c = tcolor(t.currentTier);
    const tip = `${t.displayName} — Current: ${t.currentTier}\nPeak: ${t.peakTier}`;
    return `<div class="tc" title="${esc(tip)}"><span class="gi" style="--c:${c}">${gIcon(t.gamemode, 20)}</span><b style="color:${c}">${esc(t.currentTier)}</b></div>`;
  }).join("");
  return `<a class="prow" href="?player=${encodeURIComponent(p.username)}" data-u="${esc(p.username)}">
    <div class="rk${rc}"><span class="n">${p.rank}.</span>${bust(p)}</div>
    <div class="pinfo"><div class="pname">${esc(p.username)}</div><div class="ptitle"><span class="bk">${RANK_ICON}</span><span class="tt">${esc(titleFor(p.totalPoints))}</span><i>(${fmt(p.totalPoints)} points)</i></div></div>
    ${regionCell}<div class="ptiers">${tcs}</div></a>`;
}

function pagerHtml(pg){
  const pages = Math.max(1, Math.ceil(pg.total / pg.limit));
  if(pages <= 1) return "";
  const nums = new Set([1, pages, pg.page - 1, pg.page, pg.page + 1]);
  const list = [...nums].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
  let h = `<div class="pager"><button class="btn" data-p="${pg.page - 1}" ${pg.page <= 1 ? "disabled" : ""}>Prev</button>`;
  let last = 0;
  for(const n of list){ if(n - last > 1) h += `<span class="dots">…</span>`; h += `<button class="btn pg${n === pg.page ? " on" : ""}" data-p="${n}">${n}</button>`; last = n; }
  return h + `<button class="btn" data-p="${pg.page + 1}" ${!pg.hasNext ? "disabled" : ""}>Next</button></div>`;
}

async function overallView(id){
  const d = await api(`/api/leaderboard?page=${state.page}&limit=50`);
  if(id !== reqId) return;
  const head = headHtml("Overall Rankings", `${META.totalPlayers} players ranked by points across ${META.gamemodes.length} gamemode${META.gamemodes.length === 1 ? "" : "s"}`);
  if(!d.ready || !d.players.length){
    $("#view").innerHTML = head + `<div class="state"><b>No ranked players yet.</b>Play ranked duels and finish your placements to appear here.</div>`;
    return;
  }
  const noreg = (META.regions && META.regions.length) ? "" : " noreg";
  $("#view").innerHTML = head +
    `<div class="board${noreg}"><div class="thead"><div>#</div><div>Player</div>${noreg ? "" : "<div>Region</div>"}<div class="tr">Tiers</div></div>` +
    `<div class="plist">${d.players.map(prow).join("")}</div></div>` + pagerHtml(d.pagination);
}

/* ----------------------------- gamemode view ------------------------- */
async function fetchAll(mode){
  const out = [];
  for(let page = 1; page <= 60; page++){
    const d = await api(`/api/leaderboard?gamemode=${encodeURIComponent(mode)}&page=${page}&limit=100`);
    out.push(...d.players);
    if(!d.pagination.hasNext) break;
  }
  return out;
}

function pcRow(p){
  const t = p.tiers[0];
  const c = tcolor(t.currentTier);
  const tip = `${t.currentTier} — peak ${t.peakTier} · ${t.wins}W ${t.losses}L`;
  return `<a class="pc" href="?player=${encodeURIComponent(p.username)}" data-u="${esc(p.username)}" style="--rc:${p.region ? rcolor(p.region) : "#6a4630"}" title="${esc(tip)}">${av(p, 30)}<span class="nm">${esc(p.username)}</span><span class="chev" style="color:${c};opacity:${tierLvl(t.currentTier) === "LT" ? .55 : 1}">${chevron(tierLvl(t.currentTier))}</span></a>`;
}

async function modeView(id){
  const g = META.gamemodes.find(x => x.slug === state.mode);
  if(!g){ state.mode = ""; return overallView(id); }
  const all = await fetchAll(state.mode);
  if(id !== reqId) return;
  const nums = [...new Set(META.tierNames.map(tierNum))].filter(n => n > 0).sort((a, b) => a - b);
  const cols = {};
  nums.forEach(n => cols[n] = []);
  let best = null, worst = null;
  for(const p of all){
    const t = p.tiers[0].currentTier, n = tierNum(t);
    if(cols[n]) cols[n].push(p);
    if(best === null || tierIdx(t) > tierIdx(best)) best = t;
    if(worst === null || tierIdx(t) < tierIdx(worst)) worst = t;
  }
  const head = headHtml(`<span class="mi">${gIcon(g.slug, 30)}</span>${esc(g.displayName)} Tier List`,
    all.length ? `${all.length} ranked player${all.length === 1 ? "" : "s"}, from ${esc(best)} to ${esc(worst)}` : `No ranked players in this gamemode yet`);
  if(!all.length){ $("#view").innerHTML = head + `<div class="state"><b>Nobody is ranked here yet.</b>Play ranked ${esc(g.displayName)} duels to get on the list.</div>`; return; }
  const colHtml = nums.map(n => `<div class="tcol t${n}"><div class="th">${icon("trophy", 26)}<span>Tier ${n}</span></div><div class="tl">${
    cols[n].length ? cols[n].map(pcRow).join("") : `<div class="none">No players</div>`}</div></div>`).join("");
  $("#view").innerHTML = head + `<div class="tiersrow">${colHtml}</div>`;
}

/* ------------------------------- profile ----------------------------- */
async function openPlayer(name, push){
  if(push){ boardQs = location.search; history.pushState(null, "", location.pathname + "?player=" + encodeURIComponent(name)); }
  hideResults();
  const app = $("#app");
  app.innerHTML = `<a class="back" data-act="back">← Back to rankings</a><div class="profile"><div class="skel" style="width:40%;height:28px"></div></div>`;
  try{
    const p = await api("/api/player/" + encodeURIComponent(name));
    document.title = p.username + " · " + NAME();
    const hours = Math.round(p.playSeconds / 360) / 10;
    const tiers = p.tiers.slice().sort((a, b) => tierIdx(b.currentTier) - tierIdx(a.currentTier));
    const rc = p.globalRank <= 3 ? " r" + p.globalRank : "";
    app.innerHTML = `<a class="back" data-act="back">← Back to rankings</a>
      <div class="profile">
        <div class="ph"><div class="phimg">${bust(p)}</div><div>
          <h2>${esc(p.username)}</h2>
          <div class="ptitle big"><span class="bk">${RANK_ICON}</span><span class="tt">${esc(titleFor(p.totalPoints))}</span><i>(${fmt(p.totalPoints)} points)</i></div>
          <div class="stats">
            <span class="stat">Rank <b class="rank${rc}">#${p.globalRank}</b></span>
            ${p.region ? `<span class="stat">Region <b style="color:${rcolor(p.region)}">${esc(p.region)}</b></span>` : ""}
            <span class="stat">Kills <b>${p.kills}</b></span><span class="stat">Deaths <b>${p.deaths}</b></span>
            <span class="stat">Playtime <b>${hours} h</b></span>
          </div></div></div>
        <div class="grid">${tiers.map(t => {
          const c = tcolor(t.currentTier);
          return `<div class="card"><div class="cg"><span class="gi" style="--c:${c}">${gIcon(t.gamemode, 22)}</span><div><div class="gm">${esc(t.displayName)}</div><b style="color:${c}">${esc(t.currentTier)}</b></div></div>
            <div class="line"><span>Peak</span><span>${esc(t.peakTier)}</span></div>
            <div class="line"><span>Record</span><span>${t.wins}W · ${t.losses}L</span></div>
            <div class="line"><span>Win streak</span><span>${t.streak}</span></div>
            <div class="line"><span>Points</span><span>${fmt(t.points)}</span></div></div>`;
        }).join("")}</div>
      </div>`;
  }catch(err){
    app.innerHTML = `<a class="back" data-act="back">← Back to rankings</a><div class="profile"><div class="state"><b>${err.status === 404 ? "Player not found." : "Couldn’t load this player."}</b>${err.status === 404 ? "They may not have a tier yet." : ""}</div></div>`;
  }
}
function goBoard(){ history.pushState(null, "", location.pathname + boardQs); route(); }

/* ------------------------------- search ------------------------------ */
function hideResults(){ const r = $("#sres"); if(r){ r.hidden = true; r.innerHTML = ""; } }
async function doSearch(q){
  try{
    const d = await api("/api/leaderboard?limit=6&search=" + encodeURIComponent(q));
    const r = $("#sres");
    if(!d.players.length){ r.innerHTML = `<div class="e">No player found for “${esc(q)}”.</div>`; r.hidden = false; return; }
    r.innerHTML = d.players.map(p => `<a href="?player=${encodeURIComponent(p.username)}" data-u="${esc(p.username)}">${av(p, 26)}<span>${esc(p.username)}</span><small>#${p.rank}</small></a>`).join("");
    r.hidden = false;
  }catch(e){ hideResults(); }
}

/* -------------------------------- modal ------------------------------ */
function openInfo(){
  const peak = META && META.pointsFrom === "peak";
  $("#mbox").innerHTML = `<button class="x" data-act="close" aria-label="Close">×</button>
    <h3>How the tier list works</h3>
    <p><b>No tier testing.</b> You earn your tier by playing ranked duels. Win to move up, lose to move down.</p>
    <p>Every gamemode has its own tier, from <b>LT6</b> (lowest) up to <b>HT1</b> (highest). <b>LT</b> = low tier, <b>MT</b> = mid tier, <b>HT</b> = high tier. Tier 1 is the best.</p>
    <p>Total points come from each player's <b>${peak ? "peak (best ever)" : "current"}</b> tier in every gamemode. More and higher tiers = a higher rank.</p>
    <p>The list refreshes every ${META ? META.updateMinutes : 5} minutes.</p>`;
  $("#modal").hidden = false;
}
function closeInfo(){ $("#modal").hidden = true; }
function copyIp(){
  try{ navigator.clipboard.writeText(SERVER_IP); }catch(e){ window.prompt("Server IP:", SERVER_IP); }
  const b = $('[data-act="ip"]'); if(b){ const old = b.textContent; b.textContent = "Copied!"; setTimeout(() => { b.textContent = old; }, 1200); }
}

/* ------------------------------- routing ----------------------------- */
function pushUrl(){
  const q = new URLSearchParams();
  if(state.mode) q.set("mode", state.mode);
  if(state.page > 1) q.set("page", state.page);
  history.pushState(null, "", location.pathname + (q.toString() ? "?" + q : ""));
}
async function render(){
  const id = ++reqId;
  $("#app").innerHTML = tabsHtml() + `<div id="view">${skeleton()}</div>`;
  try{
    if(state.mode) await modeView(id); else await overallView(id);
  }catch(err){
    if(id !== reqId) return;
    $("#view").innerHTML = errorHtml();
  }
}
async function route(){
  const q = new URLSearchParams(location.search);
  state.mode = q.get("mode") || "";
  state.page = Math.max(1, parseInt(q.get("page") || "1", 10) || 1);
  const pl = q.get("player");
  if(pl){ await openPlayer(pl, false); return; }
  document.title = NAME();
  if(!META.ready){ $("#app").innerHTML = `<div class="state"><b>Rankings are loading…</b>The server is still collecting data. Refresh in a moment.</div>`; return; }
  await render();
}

document.addEventListener("click", e => {
  const t = e.target;
  const c = s => (t && t.closest) ? t.closest(s) : null;
  let el;
  if(t && t.id === "modal"){ closeInfo(); return; }
  if((el = c(".tab"))){ state.mode = el.dataset.m || ""; state.page = 1; pushUrl(); render(); return; }
  if((el = c("a.prow, a.pc, .sres a"))){ e.preventDefault(); hideResults(); const q = $("#sq"); if(q) q.value = ""; openPlayer(el.dataset.u, true); return; }
  if((el = c("button[data-p]"))){ if(el.disabled) return; state.page = +el.dataset.p; pushUrl(); render(); window.scrollTo({top: 0, behavior: "smooth"}); return; }
  if(c('[data-act="info"]')){ openInfo(); return; }
  if(c('[data-act="close"]')){ closeInfo(); return; }
  if(c('[data-act="ip"]')){ copyIp(); return; }
  if(c('[data-act="retry"]')){ render(); return; }
  if(c('[data-act="home"]') || c("#brand")){ e.preventDefault(); state.mode = ""; state.page = 1; history.pushState(null, "", location.pathname); route(); return; }
  if(c('[data-act="back"]')){ e.preventDefault(); goBoard(); return; }
  if(!c(".search")) hideResults();
});
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeInfo(); hideResults(); } });
window.addEventListener("popstate", route);

(async function init(){
  const sq = $("#sq");
  sq.addEventListener("input", e => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if(!q){ hideResults(); return; }
    searchTimer = setTimeout(() => doSearch(q), 250);
  });
  sq.addEventListener("keydown", e => {
    if(e.key !== "Enter") return;
    const q = sq.value.trim(); if(!q) return;
    const first = $("#sres a");
    const name = first ? first.dataset.u : q;
    sq.value = ""; hideResults(); openPlayer(name, true);
  });
  try{
    META = await api("/api/meta");
    setHeader();
    await route();
  }catch(e){
    setHeader();
    $("#app").innerHTML = `<div class="state"><b>Couldn’t reach the server.</b>Check that the server is online and the EzTiers plugin is running.<br><br><button class="btn" onclick="location.reload()">Retry</button></div>`;
  }
  setInterval(async () => { try{ META = await api("/api/meta"); setHeader(); }catch(e){} }, 60000);
})();

</script>
</body>
